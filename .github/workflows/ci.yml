name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Workflow consistency
        run: npm run workflow:check -- --strict-budget

      - name: Documentation budgets and links
        run: npm run docs:check

      - name: Skill source audit
        run: bash scripts/skill.sh check

  beta-nestjs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install workflow repository dependencies
        run: npm ci

      - name: Public beta smoke on a clean NestJS 12 Todo API
        run: npm run test:beta:nestjs
