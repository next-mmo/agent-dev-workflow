<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Todo — Local task workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <main class="todo-app" aria-labelledby="page-title">
    <header class="app-header">
      <div>
        <p class="eyebrow">Personal workspace</p>
        <h1 id="page-title">Focus Todo</h1>
        <p id="summary" class="summary" aria-live="polite">No tasks yet</p>
      </div>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch to light mode">☼</button>
    </header>
    <p id="storage-message" role="status" hidden></p>

    <section class="composer" aria-labelledby="add-task-heading">
      <h2 id="add-task-heading">Plan your next move</h2>
      <form id="task-form" novalidate>
        <label class="sr-only" for="task-title">Task title</label>
        <div class="title-row">
          <input id="task-title" name="title" type="text" maxlength="160" placeholder="What needs your attention?" autocomplete="off" />
          <button class="primary-button" type="submit">Add task</button>
        </div>
        <div class="details-grid">
          <label>Project <input id="task-project" name="project" type="text" maxlength="40" placeholder="Inbox" autocomplete="off" /></label>
          <label>Priority <select id="task-priority" name="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label>
          <label>Due date <input id="task-due-date" name="dueDate" type="date" /></label>
        </div>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="controls" aria-label="Find tasks">
      <label class="search-field"><span class="sr-only">Search tasks</span><input id="task-search" type="search" placeholder="Search tasks or projects" /></label>
      <div id="status-filters" class="filter-group" aria-label="Task status">
        <button type="button" data-status="all" aria-pressed="true">All</button>
        <button type="button" data-status="active" aria-pressed="false">Active</button>
        <button type="button" data-status="completed" aria-pressed="false">Completed</button>
      </div>
      <label class="project-filter">Project <select id="project-filter"><option value="all">All projects</option></select></label>
    </section>

    <section class="task-panel" aria-labelledby="task-list-heading">
      <div class="task-panel-heading">
        <h2 id="task-list-heading">Tasks</h2>
        <button id="clear-completed" class="quiet-button" type="button" disabled>Clear completed</button>
      </div>
      <ul id="task-list" class="task-list" aria-label="Todo tasks"></ul>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
